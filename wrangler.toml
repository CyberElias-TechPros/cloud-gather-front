name = "cloudgather-api"
main = "worker/src/index.ts"
compatibility_date = "2026-09-21"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "http://localhost:8080"
SESSION_TTL_DAYS = "30"
APP_URL = "http://localhost:8080"

[[d1_databases]]
binding = "DB"
database_name = "cloudgather"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "worker/migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "cloudgather-files"
preview_bucket_name = "cloudgather-files-preview"

[env.preview]
name = "cloudgather-api-preview"
vars = { ALLOWED_ORIGINS = "http://localhost:8080", SESSION_TTL_DAYS = "7" }

[[env.preview.d1_databases]]
binding = "DB"
database_name = "cloudgather-preview"
database_id = "REPLACE_WITH_PREVIEW_D1_DATABASE_ID"
migrations_dir = "worker/migrations"

[[env.preview.r2_buckets]]
binding = "FILES"
bucket_name = "cloudgather-files-preview"
