name: Native Android
on:
  pull_request:
    paths: ["android/**", "worker/**", ".github/workflows/android.yml"]
  push:
    branches: [main, arena/3cca2f62-cloud-gather-front]
    paths: ["android/**", "worker/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run cf:typecheck
      - run: npm run cf:test
      - name: Verify migrations
        run: |
          python3 - <<'PY'
          import pathlib, sqlite3
          db = sqlite3.connect(':memory:')
          for migration in sorted(pathlib.Path('worker/migrations').glob('*.sql')):
              db.executescript(migration.read_text())
          PY
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        # Includes wrapper validation.
      - name: Install Android 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test, lint and assemble native application
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug bundleRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: CloudGather-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CloudGather-Android-unsigned-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
  device-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          working-directory: android
          script: ./gradlew connectedDebugAndroidTest
