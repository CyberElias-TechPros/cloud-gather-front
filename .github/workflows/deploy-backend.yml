name: Deploy backend and frontend

# Backend: cloudgather-api (Cyber account), CF_API_TOKEN + CF_ACCOUNT_ID.
# Frontend: Vercel production deploy as the token owner, which bypasses the
# Hobby collaborators block on git-triggered builds. Requires repo secrets
# VERCEL_TOKEN + VERCEL_ORG_ID + VERCEL_PROJECT_ID.

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "wrangler.production.toml"
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "vercel.json"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Preflight secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CF_API_TOKEN / CF_ACCOUNT_ID repo secrets (Cyber account)."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npm run cf:typecheck
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply cloudgather --remote --config wrangler.production.toml
      - name: Deploy Worker
        run: npx wrangler deploy --config wrangler.production.toml
      - name: Verify health
        run: |
          body="$(curl -fsS https://cloudgather-api.cyber-e54.workers.dev/api/health)"
          echo "$body"
          echo "$body" | grep -q '"status":"ok"' || { echo "::error::cloudgather-api health check failed"; exit 1; }

  deploy-frontend:
    name: Deploy Vercel frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      # Prebuilt deploy: builds locally and uploads .vercel/output, so a
      # stalled Vercel remote builder cannot hang this job.
      - name: Build for Vercel
        run: npx -y vercel@latest build --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy production frontend
        run: npx -y vercel@latest deploy --prebuilt --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
      - name: Verify proxied API
        run: |
          body="$(curl -fsS https://cloud.freegameplay.site/api/health)"
          echo "$body"
          echo "$body" | grep -q '"status":"ok"' || { echo "::error::frontend /api proxy check failed"; exit 1; }
