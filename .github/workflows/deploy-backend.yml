name: Deploy backend

# Deploys cloudgather-api (Cyber account) on push to main.
# Requires repo secrets CF_API_TOKEN + CF_ACCOUNT_ID.

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "wrangler.production.toml"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Preflight secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CF_API_TOKEN / CF_ACCOUNT_ID repo secrets (Cyber account)."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npm run cf:typecheck
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply cloudgather --remote --config wrangler.production.toml
      - name: Deploy Worker
        run: npx wrangler deploy --config wrangler.production.toml
      - name: Verify health
        run: |
          body="$(curl -fsS https://cloudgather-api.cyber-e54.workers.dev/api/health)"
          echo "$body"
          echo "$body" | grep -q '"status":"ok"' || { echo "::error::cloudgather-api health check failed"; exit 1; }
